<!doctype html>
<!--
  Nullmere Online's world in three dimensions, drawn in a browser with the
  SCENE section of Sources/NullmereWorld/WorldShaders.swift, the code the
  Metal shaders share with GLSL, so the land, the mist and the still water
  can be judged without a Mac. The world comes from the NullmereWorld
  tests (set NULLMERE_WORLD_PREVIEW to a folder).

    index.html?data=<world.json>&frame=seat|lake|whole|turned|moon|close|company
-->
<meta charset="utf-8">
<title>Nullmere world</title>
<style>html, body { margin: 0; background: #000; } #error { color: #f88; white-space: pre; font: 12px monospace; }</style>
<canvas id="world"></canvas>
<div id="error"></div>
<script type="module">
const query = new URLSearchParams(location.search);
const fail = (message) => { document.getElementById('error').textContent = message; throw new Error(message); };
const data = await fetch(query.get('data')).then((r) => r.json());
const swift = await fetch(query.get('shaders') || 'WorldShaders.swift').then((r) => r.text());
const scene = swift.match(/\/\/ BEGIN SCENE\n([\s\S]*?)\/\/ END SCENE/)?.[1] ?? fail('SCENE markers not found.');
const frame = data.frames.find((f) => f.name === (query.get('frame') || 'seat')) ?? data.frames[0];
const [width, height] = data.viewport;
const canvas = document.getElementById('world');
canvas.width = width;
canvas.height = height;
const gl = canvas.getContext('webgl2', { antialias: true, preserveDrawingBuffer: true });
if (!gl) fail('no WebGL2');

const header = `#version 300 es
precision highp float;
precision highp int;
precision highp sampler2D;
#define float2 vec2
#define float3 vec3
#define float4 vec4
#define int2 ivec2
#define NM_CONST const
#define NM_TEXTURE_ARGUMENT
#define NM_TEXTURE_PASS
#define NM_TILE(cell) texelFetch(tiles, ivec2(cell), 0)
#define NM_ATAN2(y, x) atan(y, x)
uniform sampler2D tiles;
uniform sampler2D heights;
uniform mat4 viewProjection;
uniform vec4 eye, moon, viewport, world, highlight, extent, haze, heightsGrid;
uniform vec4 houses[128];
uniform vec4 lights[8];
${scene}
`;
const landVertex = header + `
in vec3 position; in vec3 normal; in vec3 colour;
out vec3 vWorld; out vec3 vNormal; out vec3 vColour; out float vKnown; out float vWatched;
void main() {
  vec3 p = position;
  vec2 knowledge = nm_knowledgeAround(p.xz, world.x);
  float known = smoothstep(0.0, 1.0, knowledge.x);
  p.y = mix(kMistLevel, p.y, known);
  gl_Position = viewProjection * vec4(p, 1.0);
  vWorld = p;
  vNormal = normalize(mix(vec3(0.0, 1.0, 0.0), normal, known));
  vColour = nm_linear(colour);
  vKnown = knowledge.x;
  vWatched = knowledge.y;
}`;
const landFragment = header + `
in vec3 vWorld; in vec3 vNormal; in vec3 vColour; in float vKnown; in float vWatched;
out vec4 outColour;
void main() {
  float time = eye.w;
  float radius = world.x;
  vec3 n = normalize(vNormal);
  vec2 p = vWorld.xz;
  ivec2 h = nm_hexRound(nm_axial(p));
  vec4 tile = nm_tileAt(h, radius);
  float owner = tile.w;
  vec3 albedo = nm_grain(p, vColour);
  vec3 edge = nm_hexEdge(p, h);
  float pixel = max(fwidth(p.x), fwidth(p.y));
  vec3 lit = vec3(0.0);
  if (owner > 0.5 && vKnown > 0.5) {
    vec3 house = houses[min(int(owner), 127)].rgb;
    albedo = mix(albedo, house * 0.5, 0.14);
    ivec2 across = h + ivec2(int(edge.y), int(edge.z));
    vec4 other = nm_tileAt(across, radius);
    float otherOwner = other.w;
    if (abs(otherOwner - owner) > 0.5) {
      float line = 1.0 - smoothstep(pixel * 0.6, pixel * 2.2, edge.x);
      lit += house * line * 0.35;
    }
  }
  lit += nm_light(albedo, n, moon.xyz, moon.w);
  for (int i = 0; i < 4; i++) { lit += nm_pointLight(albedo, vWorld, n, lights[i], lights[i + 4]); }
  for (int i = 0; i < 7; i++) {
    ivec2 toward = ivec2(0, 0);
    if (i == 1) { toward = ivec2(1, 0); }
    if (i == 2) { toward = ivec2(-1, 0); }
    if (i == 3) { toward = ivec2(0, 1); }
    if (i == 4) { toward = ivec2(0, -1); }
    if (i == 5) { toward = ivec2(1, -1); }
    if (i == 6) { toward = ivec2(-1, 1); }
    vec4 near = nm_tileAt(h + toward, radius);
    if (near.y >= 128.0) {
      float far = length(p - nm_hexCentre(h + toward));
      lit += albedo * kHearth * 0.55 * exp(-far * far * 1.6);
    }
  }
  float hovered = (abs(float(h.x) - highlight.x) < 0.5 && abs(float(h.y) - highlight.y) < 0.5) ? 1.0 : 0.0;
  float chosen = (abs(float(h.x) - highlight.z) < 0.5 && abs(float(h.y) - highlight.w) < 0.5) ? 1.0 : 0.0;
  float ring = 1.0 - smoothstep(pixel * 0.8, pixel * 2.4, edge.x);
  lit += vec3(0.20, 0.22, 0.26) * ring * hovered * 0.6;
  lit += kGlow * (ring * 0.9 + (1.0 - smoothstep(0.0, 0.35, edge.x)) * 0.08) * chosen;
  lit = mix(nm_remembered(lit), lit, smoothstep(0.15, 0.85, vWatched));
  lit = mix(nm_mist(p, time), lit, smoothstep(0.0, 1.0, vKnown));
  float beyond = float(nm_hexDistance(h)) - radius;
  lit *= clamp(1.0 - 0.13 * beyond, 0.18, 1.0);
  lit = nm_haze(lit, distance(vWorld, eye.xyz), haze.x, haze.y);
  outColour = vec4(nm_encode(lit * haze.z), 1.0);
}`;
const waterVertex = header + `
out vec3 vWorld;
void main() {
  vec2 corner = vec2(float(gl_VertexID & 1), float(gl_VertexID >> 1));
  vec2 xz = mix(extent.xy, extent.zw, corner);
  vWorld = vec3(xz.x, 0.0, xz.y);
  gl_Position = viewProjection * vec4(vWorld, 1.0);
}`;
const waterFragment = header + `
in vec3 vWorld;
out vec4 outColour;
void main() {
  vec2 grid = (vWorld.xz - heightsGrid.xy) / haze.w + 0.5;
  float ground = texture(heights, grid / heightsGrid.zw).r;
  float depth = -ground;
  if (depth <= 0.0) { discard; }
  float time = eye.w;
  vec3 look = normalize(vWorld - eye.xyz);
  vec3 mirrored = vec3(look.x, -look.y, look.z);
  float facing = 1.0 - max(-look.y, 0.0);
  float fresnel = 0.30 + 0.70 * facing * facing * facing * facing * facing;
  vec3 starlit = kDeepWater + (nm_stars(mirrored, time) + nm_moonGlow(mirrored, moon.xyz)) * fresnel;
  vec3 moonlit = nm_moonlight(mirrored, moon.xyz) * fresnel;
  float clear = smoothstep(0.0, 0.14, depth);
  ivec2 h = nm_hexRound(nm_axial(vWorld.xz));
  vec2 knowledge = nm_knowledge(h, world.x);
  vec3 colour = mix(nm_remembered(starlit + moonlit * (1.0 - knowledge.x)), starlit, knowledge.y) + moonlit * knowledge.x;
  colour = nm_haze(colour, distance(vWorld, eye.xyz), haze.x, haze.y);
  outColour = vec4(nm_encode(colour * haze.z), clear);
}`;

const modelVertex = header + `
uniform sampler2D palette;
in vec3 position; in vec4 normalMaterial; in vec4 colorSway; in float part; in float surface;
in vec4 m0; in vec4 m1; in vec4 m2; in vec4 m3; in vec4 iColour; in vec4 iParams; in ivec2 iHex; in uint iPalette; in uint iFlags;
out vec3 vWorld; out vec3 vNormal; out vec3 vColour; out float vLocalY; out vec3 vLocal; out vec3 vLocalNormal;
flat out float vMaterial; flat out vec4 vParams; flat out float vWatched; flat out float vSurface;
void main() {
  float material = normalMaterial.w;
  float sway = colorSway.w / 255.0;
  float time = eye.w + iParams.z;
  vec3 local = position;
  if (sway > 0.0) { local += nm_wind(local, sway, material, time) * world.w; }
  int row = int(iPalette) + int(part);
  mat4 posing = mat4(texelFetch(palette, ivec2(0, row), 0), texelFetch(palette, ivec2(1, row), 0),
                     texelFetch(palette, ivec2(2, row), 0), texelFetch(palette, ivec2(3, row), 0));
  vec4 posed = posing * vec4(local, 1.0);
  mat4 model = mat4(m0, m1, m2, m3);
  vec4 place = model * posed;
  vec3 normal = (model * (posing * vec4(normalMaterial.xyz / 127.0, 0.0))).xyz;
  float watched = 1.0;
  if ((iFlags & 1u) == 0u) {
    vec2 knowledge = nm_knowledge(iHex, world.x);
    watched = knowledge.y > 0.5 ? 1.0 : (knowledge.x > 0.5 ? 0.5 : 0.0);
  }
  vec3 albedo = nm_linear(colorSway.xyz / 255.0);
  if ((material > 0.5 && material < 1.5) || (material > 3.5 && material < 4.5)) {
    if (iColour.a > 0.5) {
      float shade = dot(albedo, vec3(0.30, 0.55, 0.15));
      albedo = iColour.rgb * shade * 2.0;
    }
  }
  gl_Position = watched > 0.25 ? viewProjection * place : vec4(0.0, 0.0, 2.0, 1.0);
  vWorld = place.xyz;
  vNormal = normalize(normal);
  vColour = albedo;
  vLocalY = posed.y;
  vLocal = position;
  vLocalNormal = normalMaterial.xyz / 127.0;
  vSurface = surface;
  vMaterial = material;
  vParams = iParams;
  vWatched = watched;
}`;
const modelFragment = header + `
in vec3 vWorld; in vec3 vNormal; in vec3 vColour; in float vLocalY; in vec3 vLocal; in vec3 vLocalNormal;
flat in float vMaterial; flat in vec4 vParams; flat in float vWatched; flat in float vSurface;
out vec4 outColour;
void main() {
  if (vLocalY > vParams.x) { discard; }
  if (vParams.y < 0.999 && vParams.y <= nm_bayer(gl_FragCoord.xy)) { discard; }
  float time = eye.w + vParams.z;
  vec3 n = normalize(vNormal);
  vec3 toEye = normalize(eye.xyz - vWorld);
  if (dot(n, toEye) < 0.0) { n = -n; }
  vec3 albedo = nm_surface(vColour, vLocal, vLocalNormal, vSurface, length(fwidth(vLocal)));
  vec3 lit = nm_light(albedo, n, moon.xyz, moon.w);
  for (int i = 0; i < 4; i++) { lit += nm_pointLight(albedo, vWorld, n, lights[i], lights[i + 4]); }
  float facing = 1.0 - max(dot(n, toEye), 0.0);
  float behind = max(dot(-toEye, moon.xyz), 0.0);
  lit += kMoonColour * facing * facing * facing * (0.04 + 0.22 * behind) * moon.w;
  if (vMaterial > 5.5) {
    vec3 halfway = normalize(toEye + moon.xyz);
    lit += kMoonColour * pow(max(dot(n, halfway), 0.0), 48.0) * 0.9 * moon.w;
  } else if (vMaterial > 4.5) {
    float glint = pow(max(dot(n, normalize(toEye + moon.xyz)), 0.0), 20.0);
    lit += vColour * (0.16 + 0.1 * sin(nm_spin(time, 1.7) + vWorld.x * 5.0)) + vec3(0.6, 0.7, 0.9) * glint * 0.5;
  } else if (vMaterial > 1.5 && vMaterial < 2.5) {
    lit = vColour * (1.55 + 0.35 * nm_flicker(time + vWorld.x * 3.0 + vWorld.z * 2.0) * world.w);
  }
  if (vParams.x < 50.0 && vLocalY > vParams.x - 0.025) { lit += vec3(0.05, 0.042, 0.03); }
  lit += kGlow * vParams.w * facing * facing * 0.45;
  if (vWatched < 0.75) { lit = nm_remembered(lit); }
  lit = nm_haze(lit, distance(vWorld, eye.xyz), haze.x, haze.y);
  outColour = vec4(nm_encode(lit * haze.z), 1.0);
}`;

const moteVertex = header + `
in vec4 place; in vec4 colour;
out vec2 vCorner; out vec4 vColour; out vec3 vWorld;
void main() {
  int v = gl_VertexID;
  vec2 corner = vec2((v == 1 || v == 4 || v == 5) ? 1.0 : -1.0, (v == 2 || v == 3 || v == 5) ? 1.0 : -1.0);
  vec3 forward = normalize(place.xyz - eye.xyz);
  vec3 right = normalize(cross(forward, vec3(0.0, 1.0, 0.0)));
  vec3 up = cross(right, forward);
  vec3 p = place.xyz + (right * corner.x + up * corner.y) * place.w;
  vec2 knowledge = nm_knowledge(nm_hexRound(nm_axial(place.xz)), world.x);
  gl_Position = knowledge.x > 0.5 ? viewProjection * vec4(p, 1.0) : vec4(0.0, 0.0, 2.0, 1.0);
  vCorner = corner;
  vColour = colour;
  vWorld = p;
}`;
const moteFragment = header + `
in vec2 vCorner; in vec4 vColour; in vec3 vWorld;
out vec4 outColour;
void main() {
  float r = length(vCorner);
  if (r > 1.0) { discard; }
  float soft = 1.0 - smoothstep(0.1, 1.0, r);
  float far = 1.0 - clamp(1.0 - exp(-max(distance(vWorld, eye.xyz) - haze.x, 0.0) * haze.y), 0.0, 0.85);
  vec3 light = vColour.rgb * soft * far * haze.z;
  outColour = vec4(nm_encode(light), vColour.a * soft);
}`;

function compile(type, source) {
  const shader = gl.createShader(type);
  gl.shaderSource(shader, source);
  gl.compileShader(shader);
  if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
    const lines = source.split('\n').map((l, i) => `${i + 1}: ${l}`).join('\n');
    fail(gl.getShaderInfoLog(shader) + '\n' + lines.slice(0, 200));
  }
  return shader;
}
function program(vertex, fragment) {
  const p = gl.createProgram();
  gl.attachShader(p, compile(gl.VERTEX_SHADER, vertex));
  gl.attachShader(p, compile(gl.FRAGMENT_SHADER, fragment));
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) fail(gl.getProgramInfoLog(p));
  return p;
}
const decode = (b64, Type) => { const bytes = Uint8Array.from(atob(b64), (c) => c.charCodeAt(0)); return new Type(bytes.buffer); };

function uniforms(p) {
  gl.useProgram(p);
  const set = (name, f, value) => { const at = gl.getUniformLocation(p, name); if (at) f.call(gl, at, value); };
  set('viewProjection', (at, v) => gl.uniformMatrix4fv(at, false, v), new Float32Array(frame.viewProjection));
  for (const name of ['eye', 'moon', 'viewport', 'world', 'highlight', 'extent', 'haze']) set(name, gl.uniform4fv, new Float32Array(frame[name]));
  set('heightsGrid', gl.uniform4fv, new Float32Array(frame.heights));
  set('houses', gl.uniform4fv, new Float32Array(frame.houses));
  set('lights', gl.uniform4fv, new Float32Array(frame.lights || new Array(32).fill(0)));
  set('tiles', gl.uniform1i, 0);
  set('heights', gl.uniform1i, 1);
}

// The tiles, as bytes the shader reads back to the byte.
const tileBytes = Uint8Array.from(atob(frame.tiles), (c) => c.charCodeAt(0));
gl.activeTexture(gl.TEXTURE0);
gl.bindTexture(gl.TEXTURE_2D, gl.createTexture());
gl.pixelStorei(gl.UNPACK_ALIGNMENT, 1);
gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, data.side, data.side, 0, gl.RGBA, gl.UNSIGNED_BYTE, tileBytes);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
// The heights, as half floats so they filter everywhere, as on the Mac.
gl.activeTexture(gl.TEXTURE1);
gl.bindTexture(gl.TEXTURE_2D, gl.createTexture());
const heights = decode(data.heights, Float32Array);
gl.texImage2D(gl.TEXTURE_2D, 0, gl.R16F, data.columns, data.rows, 0, gl.RED, gl.FLOAT, heights);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);

gl.viewport(0, 0, width, height);
gl.clearColor(0.06, 0.065, 0.09, 1);
gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
gl.enable(gl.DEPTH_TEST);
gl.depthFunc(gl.LEQUAL);

const land = program(landVertex, landFragment);
uniforms(land);
const vao = gl.createVertexArray();
gl.bindVertexArray(vao);
for (const [name, b64] of [['position', data.positions], ['normal', data.normals], ['colour', data.colors]]) {
  const buffer = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
  gl.bufferData(gl.ARRAY_BUFFER, decode(b64, Float32Array), gl.STATIC_DRAW);
  const at = gl.getAttribLocation(land, name);
  gl.enableVertexAttribArray(at);
  gl.vertexAttribPointer(at, 3, gl.FLOAT, false, 0, 0);
}
const indices = decode(data.indices, Uint32Array);
gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, gl.createBuffer());
gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, indices, gl.STATIC_DRAW);
gl.drawElements(gl.TRIANGLES, indices.length, gl.UNSIGNED_INT, 0);

// The models: each kind's mesh, drawn once for each of its instances,
// posed from the palette, as the Metal renderer draws them.
if (frame.scene) {
  const models = program(modelVertex, modelFragment);
  uniforms(models);
  const poses = decode(frame.scene.palette, Float32Array);
  gl.activeTexture(gl.TEXTURE2);
  gl.bindTexture(gl.TEXTURE_2D, gl.createTexture());
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA32F, 4, frame.scene.poses, 0, gl.RGBA, gl.FLOAT, poses);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
  gl.uniform1i(gl.getUniformLocation(models, 'palette'), 2);
  const at = (name) => gl.getAttribLocation(models, name);
  for (const batch of frame.scene.batches) {
    const mesh = data.models[batch.key];
    if (!mesh || batch.count === 0) continue;
    const vao = gl.createVertexArray();
    gl.bindVertexArray(vao);
    gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
    gl.bufferData(gl.ARRAY_BUFFER, decode(mesh.vertices, Uint8Array), gl.STATIC_DRAW);
    const vertex = (name, size, type, offset, integer) => {
      const index = at(name);
      if (index < 0) return;
      gl.enableVertexAttribArray(index);
      if (integer) gl.vertexAttribIPointer(index, size, type, 24, offset);
      else gl.vertexAttribPointer(index, size, type, false, 24, offset);
    };
    vertex('position', 3, gl.FLOAT, 0);
    vertex('normalMaterial', 4, gl.BYTE, 12);
    vertex('colorSway', 4, gl.UNSIGNED_BYTE, 16);
    vertex('part', 1, gl.UNSIGNED_SHORT, 20);
    vertex('surface', 1, gl.UNSIGNED_SHORT, 22);
    gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
    gl.bufferData(gl.ARRAY_BUFFER, decode(batch.instances, Uint8Array), gl.STATIC_DRAW);
    const instance = (name, size, type, offset, integer) => {
      const index = at(name);
      if (index < 0) return;
      gl.enableVertexAttribArray(index);
      if (integer) gl.vertexAttribIPointer(index, size, type, 112, offset);
      else gl.vertexAttribPointer(index, size, type, false, 112, offset);
      gl.vertexAttribDivisor(index, 1);
    };
    ['m0', 'm1', 'm2', 'm3'].forEach((name, column) => instance(name, 4, gl.FLOAT, column * 16));
    instance('iColour', 4, gl.FLOAT, 64);
    instance('iParams', 4, gl.FLOAT, 80);
    instance('iHex', 2, gl.INT, 96, true);
    instance('iPalette', 1, gl.UNSIGNED_INT, 104, true);
    instance('iFlags', 1, gl.UNSIGNED_INT, 108, true);
    gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, gl.createBuffer());
    gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, decode(mesh.indices, Uint32Array), gl.STATIC_DRAW);
    gl.drawElementsInstanced(gl.TRIANGLES, mesh.count, gl.UNSIGNED_INT, 0, batch.count);
  }
}

const water = program(waterVertex, waterFragment);
uniforms(water);
gl.bindVertexArray(gl.createVertexArray());
gl.enable(gl.BLEND);
gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
gl.depthMask(false);
gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

// The motes over all, giving light and hiding by their own measures.
if (frame.scene && frame.scene.moteCount > 0) {
  const motes = program(moteVertex, moteFragment);
  uniforms(motes);
  gl.bindVertexArray(gl.createVertexArray());
  gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
  gl.bufferData(gl.ARRAY_BUFFER, decode(frame.scene.motes, Uint8Array), gl.STATIC_DRAW);
  for (const [name, offset] of [['place', 0], ['colour', 16]]) {
    const at = gl.getAttribLocation(motes, name);
    if (at < 0) continue;
    gl.enableVertexAttribArray(at);
    gl.vertexAttribPointer(at, 4, gl.FLOAT, false, 32, offset);
    gl.vertexAttribDivisor(at, 1);
  }
  gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
  gl.drawArraysInstanced(gl.TRIANGLES, 0, 6, frame.scene.moteCount);
}
document.title = 'ready';
</script>
