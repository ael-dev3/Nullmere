<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nullmere map preview</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
  pre { position: fixed; inset: 16px; margin: 0; color: #f0a0a0; font: 12px/1.5 ui-monospace, monospace; white-space: pre-wrap; }
</style>
</head>
<body>
<canvas id="map"></canvas>
<pre id="error"></pre>
<script type="module">
// Renders the SCENE section of WorldShader.swift with WebGL2, from a tile
// texture written by scripts/world-preview-data.sh, so the map can be tuned
// without a Mac. Serve the repository root:
//
//   python3 -m http.server     then open
//   http://localhost:8000/Tools/world-preview/?data=../../build/world-preview/opening.json
//
// Query parameters: data (the tiles, required), scale (points per world
// unit, 28 as a game opens), x and y (the view's centre in world units; the
// seat by default, or "moon"), time (seconds, frozen; 20 by default).
const query = new URLSearchParams(location.search);
const canvas = document.getElementById('map');
const gl = canvas.getContext('webgl2');
function fail(message) {
  document.getElementById('error').textContent = message;
  throw new Error(message);
}
if (!gl) fail('WebGL2 is not available in this browser.');
if (!query.get('data')) fail('Pass ?data= the tiles written by scripts/world-preview-data.sh.');

const data = await fetch(query.get('data')).then((r) => r.json());
const swift = await fetch('../../Sources/NullmereKit/World/WorldShader.swift').then((r) => r.text());
const scene = swift.match(/\/\/ BEGIN SCENE\n([\s\S]*?)\/\/ END SCENE/)?.[1] ?? fail('SCENE markers not found.');

function compile(type, source) {
  const shader = gl.createShader(type);
  gl.shaderSource(shader, source);
  gl.compileShader(shader);
  if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) fail(gl.getShaderInfoLog(shader));
  return shader;
}
const program = gl.createProgram();
gl.attachShader(program, compile(gl.VERTEX_SHADER, `#version 300 es
void main() {
  vec2 corner = vec2(float((gl_VertexID << 1) & 2), float(gl_VertexID & 2));
  gl_Position = vec4(corner * 2.0 - 1.0, 0.0, 1.0);
}`));
gl.attachShader(program, compile(gl.FRAGMENT_SHADER, `#version 300 es
precision highp float;
precision highp sampler2D;
#define float2 vec2
#define float3 vec3
#define float4 vec4
uniform sampler2D data;
#define NM_TEXTURE_ARGUMENT
#define NM_TEXTURE_PASS
#define NM_TILE(cell) texelFetch(data, ivec2(cell), 0)
#define NM_ATAN2(y, x) atan(y, x)
${scene}
uniform vec4 view;
uniform vec4 camera;
uniform vec4 moon;
out vec4 color;
void main() {
  vec2 px = vec2(gl_FragCoord.x, view.y - gl_FragCoord.y);
  color = vec4(nm_world(px, view.xy, view.z, view.w, camera.xy, camera.z, camera.w, vec4(999.0), moon), 1.0);
}`));
gl.linkProgram(program);
if (!gl.getProgramParameter(program, gl.LINK_STATUS)) fail(gl.getProgramInfoLog(program));
gl.useProgram(program);

const bytes = Uint8Array.from(atob(data.bytes), (c) => c.charCodeAt(0));
const texture = gl.createTexture();
gl.bindTexture(gl.TEXTURE_2D, texture);
gl.pixelStorei(gl.UNPACK_ALIGNMENT, 1);
gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, data.side, data.side, 0, gl.RGBA, gl.UNSIGNED_BYTE, bytes);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);

const ppp = devicePixelRatio;
const width = Math.round(innerWidth * ppp), height = Math.round(innerHeight * ppp);
canvas.width = width;
canvas.height = height;
gl.viewport(0, 0, width, height);
const scale = Number(query.get('scale') ?? 28);
let [x, y] = data.seat;
if (query.get('x') === 'moon') [x, y] = data.moon;
else if (query.has('x')) [x, y] = [Number(query.get('x')), Number(query.get('y'))];
gl.uniform4f(gl.getUniformLocation(program, 'view'), width, height, scale * ppp, Number(query.get('time') ?? 20));
gl.uniform4f(gl.getUniformLocation(program, 'camera'), x, y, data.radius, ppp);
gl.uniform4f(gl.getUniformLocation(program, 'moon'), ...data.moon);
gl.uniform1i(gl.getUniformLocation(program, 'data'), 0);
gl.drawArrays(gl.TRIANGLES, 0, 3);
</script>
</body>
</html>
