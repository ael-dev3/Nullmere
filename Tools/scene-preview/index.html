<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nullmere scene preview</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
  pre { position: fixed; inset: 16px; margin: 0; color: #f0a0a0; font: 12px/1.5 ui-monospace, monospace; white-space: pre-wrap; }
</style>
</head>
<body>
<canvas id="scene"></canvas>
<pre id="error"></pre>
<script type="module">
// Renders the SCENE section of LakeShader.swift with WebGL2, so the backdrop
// can be tuned without rebuilding the app. Serve the repository root:
//
//   python3 -m http.server     then open http://localhost:8000/Tools/scene-preview/
//
// Optional query parameters: horizon (0.47), activity (1 at full motion, 0.4
// reduced, 0 still), time (freeze at seconds).
const query = new URLSearchParams(location.search);
const horizon = Number(query.get('horizon') ?? 0.47);
const activity = Number(query.get('activity') ?? 1);
const frozenTime = query.has('time') ? Number(query.get('time')) : null;

const canvas = document.getElementById('scene');
const gl = canvas.getContext('webgl2');

function fail(message) {
  document.getElementById('error').textContent = message;
  throw new Error(message);
}

function compile(type, source) {
  const shader = gl.createShader(type);
  gl.shaderSource(shader, source);
  gl.compileShader(shader);
  if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) fail(gl.getShaderInfoLog(shader));
  return shader;
}

if (!gl) fail('WebGL2 is not available in this browser.');
const swift = await fetch('../../Sources/LauncherKit/Backdrop/LakeShader.swift').then((r) => r.text());
const scene = swift.match(/\/\/ BEGIN SCENE\n([\s\S]*?)\/\/ END SCENE/)?.[1] ?? fail('SCENE markers not found.');

const program = gl.createProgram();
gl.attachShader(program, compile(gl.VERTEX_SHADER, `#version 300 es
void main() {
  vec2 corner = vec2(float((gl_VertexID << 1) & 2), float(gl_VertexID & 2));
  gl_Position = vec4(corner * 2.0 - 1.0, 0.0, 1.0);
}`));
gl.attachShader(program, compile(gl.FRAGMENT_SHADER, `#version 300 es
precision highp float;
#define float2 vec2
#define float3 vec3
#define float4 vec4
${scene}
uniform vec2 sizePt;
uniform vec2 pixels;
uniform vec3 params;
out vec4 color;
void main() {
  color = vec4(nm_scene(gl_FragCoord.xy / pixels, sizePt, gl_FragCoord.xy, params.x, params.y, params.z), 1.0);
}`));
gl.linkProgram(program);
if (!gl.getProgramParameter(program, gl.LINK_STATUS)) fail(gl.getProgramInfoLog(program));
gl.useProgram(program);

const start = performance.now();
function frame(now) {
  const scale = devicePixelRatio;
  const width = Math.round(innerWidth * scale);
  const height = Math.round(innerHeight * scale);
  if (canvas.width !== width || canvas.height !== height) {
    canvas.width = width;
    canvas.height = height;
  }
  gl.viewport(0, 0, width, height);
  gl.uniform2f(gl.getUniformLocation(program, 'sizePt'), innerWidth, innerHeight);
  gl.uniform2f(gl.getUniformLocation(program, 'pixels'), width, height);
  gl.uniform3f(gl.getUniformLocation(program, 'params'), frozenTime ?? (now - start) / 1000, activity, horizon);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  if (frozenTime === null) requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
