name: Live realm smoke

# Two keepers' clients, as shipped, meet in the live realm on maincloud:
# they arrive, see each other's Houses and hear each other speak; then the
# first keeper's phone, its own session as the companion app keeps it,
# takes the link her Mac offers and keeps her House beside it, words going
# each way, its line cut and mended (no seat of its own). It needs no
# secret, only the realm published (Publish the realm) and its steward
# running (scripts/raise-realm.sh maincloud). Run by hand, and each day.
on:
  workflow_dispatch:
    inputs:
      address:
        description: "The live realm's address"
        default: https://maincloud.spacetimedb.com/nullmere
        required: true
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

jobs:
  smoke:
    name: Two keepers meet in the live realm
    runs-on: ubuntu-24.04
    container: swift:6.2-noble
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - name: Is the realm up?
        id: up
        env:
          ADDRESS: ${{ inputs.address || 'https://maincloud.spacetimedb.com/nullmere' }}
        run: |
          apt-get update -qq && apt-get install -y -qq curl >/dev/null
          echo "address=$ADDRESS" >> "$GITHUB_OUTPUT"
          if REALM_ADDRESS="$ADDRESS" scripts/go-live-status.sh --expect-realm; then
            echo "up=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::The live realm at $ADDRESS isn't up yet: see docs/GO-LIVE.md, step 1"
            echo "up=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Two keepers meet in it, and a phone keeps one's House
        if: steps.up.outputs.up == 'true'
        env:
          NULLMERE_LIVE_REALM: ${{ steps.up.outputs.address }}
        run: |
          swift test --filter LiveRealmSmokeTests 2>&1 | tee live-smoke.log
          grep -Eq "Executed 1 test, with 0 failures" live-smoke.log && ! grep -q "skipped" live-smoke.log
          grep "^LIVE " live-smoke.log
