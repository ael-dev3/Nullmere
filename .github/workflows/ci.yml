name: CI

# A run for each pull request update, and each push to main or a working
# branch: the app built, tested and bundled on macOS; a realm raised on
# SpacetimeDB; and the launcher's screens photographed. Changes that only
# touch documentation or the lake's browser preview don't start a run, nor
# those to the trailer's own files alone (the Trailer workflow's).
on:
  pull_request:
    paths:
      - Package.swift
      - Sources/**
      - Tests/**
      - Packaging/**
      - scripts/**
      - perf/**
      - realm-server/**
      - Dockerfile.steward
      - news/**
      - Tools/**
      - UITests/**
      - Makefile
      - .github/workflows/ci.yml
      # The models made in Blender: their scripts and files, which the tests hold to what the package carries.
      - Art/**
      # The trailer's own files: the Trailer workflow renders and tests them.
      - "!Sources/NullmereTrailer/**"
      - "!Tests/NullmereTrailerTests/**"
      - "!Tests/TrailerRenderTests/**"
      - "!scripts/render-trailer.sh"
  push:
    branches: [main, "claude/**"]
    paths:
      - Package.swift
      - Sources/**
      - Tests/**
      - Packaging/**
      - scripts/**
      - perf/**
      - realm-server/**
      - Dockerfile.steward
      - news/**
      - Tools/**
      - UITests/**
      - Makefile
      - .github/workflows/ci.yml
      # The models made in Blender: their scripts and files, which the tests hold to what the package carries.
      - Art/**
      # The trailer's own files: the Trailer workflow renders and tests them.
      - "!Sources/NullmereTrailer/**"
      - "!Tests/NullmereTrailerTests/**"
      - "!Tests/TrailerRenderTests/**"
      - "!scripts/render-trailer.sh"
  workflow_dispatch:

permissions:
  contents: read

# On main a run under way is let finish, so every push that starts one is
# measured whole (its tests, coverage and frame times); a push made while
# one runs waits behind it, and a later push takes the waiting one's place.
# Pull requests and working branches cancel their run under way, as before.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  macos:
    name: Build, test and bundle
    # macOS 26 and Xcode 26: the launcher needs the Foundation Models
    # framework, and its tests only run on the OS they target.
    runs-on: macos-26
    # Write only to push the screenshots to the ci-shots branch.
    permissions:
      contents: write
    # The tests alone take some twenty-five to thirty minutes now that the
    # world's models, motes and lights are rendered on the GPU; then the
    # bundle, the release rehearsal and the screenshots of the game and the
    # realm: about forty minutes on a quick runner, over forty-five on a slow one.
    timeout-minutes: 60
    # "bash" runs with -o pipefail, so a failure piped through tee still fails.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Check the scripts
        run: scripts/check-scripts.sh

      - name: Build
        id: build
        run: |
          swift build 2>&1 | tee build.log
          # A clean build: no warnings from our own sources.
          if grep -E "^/.*/Sources/.*: warning:" build.log; then
            echo "::error::The build has warnings"
            exit 1
          fi

      - name: Test
        run: NULLMERE_KEEP_RENDERS="$PWD/build" swift test --enable-code-coverage 2>&1 | tee build-test.log

      # How much of each module the tests run, held to a floor.
      - name: Coverage
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: mkdir -p build && python3 scripts/coverage.py "$(swift test --show-codecov-path)" NullmereCore=98 NullmereModels=98 NullmereWorld=98 NullmereSound=98 NullmereRealm=98 NullmereKit=97.5 LauncherCore=98.5 LauncherKit=98 --worst 40 --lines 40 | tee build/coverage.log

      # How long each scene takes the GPU at a MacBook Pro's native
      # resolution, a whole frame while the camera pans, an order and a
      # watch: held to perf/baseline.json, so a regression fails the build.
      - name: Frame times
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          grep "PERF " build-test.log || true
          mkdir -p build
          python3 scripts/perf-check.py build-test.log perf/baseline.json --json build/perf.json | tee build/perf-check.log

      # Xcode 26 and later ship the Metal compiler separately. Fetch it only
      # when no installed Xcode has one; check-shader.sh also tries them all.
      # A slow or failed download only skips the offline compile (with a
      # warning); `swift test` still compiles the shader on the runner's GPU.
      - name: Ensure a Metal compiler
        timeout-minutes: 10
        continue-on-error: true
        run: |
          if xcrun -sdk macosx metal --version >/dev/null 2>&1; then
            echo "Metal compiler available in the selected Xcode"
            exit 0
          fi
          for app in /Applications/Xcode*.app; do
            if DEVELOPER_DIR="$app/Contents/Developer" xcrun -sdk macosx metal --version >/dev/null 2>&1; then
              echo "Metal compiler available in $app"
              exit 0
            fi
          done
          xcodebuild -downloadComponent MetalToolchain || echo "::warning::Could not download the Metal toolchain"

      - name: Compile the shaders offline
        run: scripts/check-shader.sh

      - name: Bundle app
        run: scripts/build-app.sh

      - name: Verify bundles
        run: |
          verify() {
            app="build/$1.app"
            codesign --verify --deep --strict --verbose=2 "$app"
            test -x "$app/Contents/MacOS/$2"
            test "$(lipo -archs "$app/Contents/MacOS/$2")" = "arm64"
            test "$(plutil -extract LSMinimumSystemVersion raw "$app/Contents/Info.plist")" = "26.0"
            test "$(plutil -extract CFBundleIdentifier raw "$app/Contents/Info.plist")" = "$3"
            test -s "$app/Contents/Resources/AppIcon.icns"
          }
          verify "Nullmere Online" NullmereLauncher online.nullmere.launcher
          test "$(plutil -extract NullmereRealm raw "build/Nullmere Online.app/Contents/Info.plist")" = "https://maincloud.spacetimedb.com/nullmere"
          test ! -e build/Nullmere.app
          # The Liquid Glass icon compiled into the app.
          for app in "build/Nullmere Online.app"; do
            test -s "$app/Contents/Resources/Assets.car"
            test "$(plutil -extract CFBundleIconName raw "$app/Contents/Info.plist")" = "AppIcon"
          done
          # A look at the icon as compiled, for readers of the log.
          sips -s format png "build/Nullmere Online.app/Contents/Resources/AppIcon.icns" --out build/icon.png >/dev/null

      # The disk image players download, made the way a release is made,
      # and checked as the release workflow checks the one that ships.
      - name: Pack the disk image
        run: |
          scripts/release.sh
          dmg="$(ls build/Nullmere-Online-*.dmg)"
          version="${dmg#build/Nullmere-Online-}"
          scripts/verify-release.sh "$dmg" "${version%.dmg}"
          ls -lh "$dmg"

      - name: Keep the disk image
        uses: actions/upload-artifact@v6
        with:
          name: nullmere-online-dmg
          path: build/Nullmere-Online-*.dmg
          if-no-files-found: error

      # The signed, notarized release rehearsed with a throwaway identity:
      # the same steps release.yml takes with the Developer ID, so a real
      # release wants only the secrets.
      - name: Rehearse a signed release
        timeout-minutes: 10
        run: scripts/rehearse-release.sh 2>&1 | tee build/rehearsal.log

      # Opens the real app on the runner: it must keep running and render its
      # lake with Metal, and hear from Apple's Foundation Models whether the
      # on-device model is ready, then show the matching screen. The screenshot (Dock
      # included) is kept as an artifact, and a small copy is printed in the
      # log for readers without artifact access.
      - name: Launch the app
        run: mkdir -p build && scripts/smoke-test-app.sh 2>&1 | tee build/smoke-app.log

      # The voices as a keeper hears them, from this runner's own on-device
      # model, which answers an app and not a test runner's bare process:
      # the debug app asks it for each kind of envoy and chronicle entry,
      # and every line is held to the voices' rules. A runner whose model
      # isn't ready to speak says so and passes on; a line that breaks the
      # rules fails. GitHub's virtual Macs have so far told the debug app
      # they aren't eligible, under its own name or the app's and after
      # waiting for the model's word, though the release app's own check
      # finds the model ready: the release build carries no hooks to ask it
      # with, so the voices are heard on a real Mac (docs/GO-LIVE.md).
      - name: The voices, from the runner's own model
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 15
        run: |
          scripts/check-voices.sh || [ $? -eq 2 ]

      # Counsel taken of a commander through the runner's own model, as on a
      # keeper's Mac: three questions answered with the counsel's looks, an
      # order put forward, an answer stopped. CI's virtual runners aren't
      # eligible for Apple Intelligence, so here it is told unverified (2),
      # never passed; a real Mac verifies it (docs/GAPS.md).
      - name: Commanders' counsel, from the runner's own model
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 10
        run: |
          app="build/voices/Nullmere Online.app"
          if [ -d "$app" ]; then scripts/check-counsel.sh --app "$app" || [ $? -eq 2 ]; else scripts/check-counsel.sh || [ $? -eq 2 ]; fi

      # Opens the debug build of the launcher as if the model were ready
      # (only debug builds allow that), to photograph its menu, News and
      # Settings, which the requirement screen otherwise hides on CI.
      - name: Open the launcher's menu
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: mkdir -p build && scripts/smoke-test-launcher-menu.sh 2>&1 | tee build/smoke-menu.log

      # Opens the debug build past the model gate (only debug builds allow
      # that), presses Play and enters a realm hosted on the runner as a
      # keeper, whose world must render with Metal; then the same realm
      # forty watches on.
      - name: Open the game
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: mkdir -p build && DEBUG_PASSES=1 DEBUG_PASS_LIST="land light fog" scripts/smoke-test-game.sh 2>&1 | tee build/smoke-game.log

      # A realm raised on the runner, as on maincloud: SpacetimeDB with the
      # realm module published, and the steward beside it. Then the app
      # itself enters the world across the network.
      - name: Raise a realm on SpacetimeDB
        id: realm
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 20
        run: |
          command -v rustup >/dev/null || curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.cargo/bin:$HOME/.local/bin:$PATH"
          curl -sSf https://install.spacetimedb.com | sh -s -- --yes
          # The same one command that raises the realm proper.
          STEWARD=background CONFIGURATION=debug STEWARD_LOG="$PWD/build/steward.log" \
            NULLMERE_REALM_SEED="black moon" scripts/raise-realm.sh local

      - name: Enter the realm across the network
        if: ${{ !cancelled() && steps.realm.outcome == 'success' }}
        env:
          NULLMERE_REALM: http://127.0.0.1:3000/nullmere
        run: mkdir -p build && scripts/smoke-test-network.sh 2>&1 | tee build/smoke-network.log

      # Nullmere Companion, the keeper's iPhone app, built for the iOS
      # Simulator from the same package, bundled and signed to run there.
      - name: Build the companion for the iOS Simulator
        id: companion
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 20
        # bash -eo pipefail: the script's own failure fails the step, not tee's success.
        shell: bash
        run: mkdir -p build && scripts/build-companion.sh 2>&1 | tee build/companion-build.log

      # Both real apps on the realm raised above: the Mac enters and offers
      # a link; the phone, in the simulator, takes it, plays, is set aside
      # and comes in again, and the Mac sees its order. Then the phone takes
      # counsel through its own on-device model: unverified where the
      # runner's model can't be asked, as so far it can't.
      - name: The keeper's phone beside their Mac
        if: ${{ !cancelled() && steps.companion.outcome == 'success' && steps.realm.outcome == 'success' }}
        timeout-minutes: 15
        shell: bash
        env:
          NULLMERE_REALM: http://127.0.0.1:3000/nullmere
        run: scripts/smoke-test-companion.sh 2>&1 | tee build/smoke-companion.log

      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: screenshots
          path: build/*.png
          if-no-files-found: warn

      # The screenshots, full size, on the ci-shots branch: one folder per
      # run, so they can be fetched with git alone.
      - name: Push the screenshots to ci-shots
        if: always() && github.event_name == 'push'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN: ${{ github.run_number }}
          SHA: ${{ github.sha }}
        run: |
          set -eu
          ls build/*.png >/dev/null 2>&1 || exit 0
          dir=$(mktemp -d)
          cd "$dir"
          git init -q
          git config user.name "ci-shots"
          git config user.email "ci-shots@users.noreply.github.com"
          url="https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git fetch -q --depth 1 "$url" ci-shots 2>/dev/null; then git checkout -q FETCH_HEAD; else git checkout -q --orphan ci-shots; fi
          git checkout -q -B ci-shots
          mkdir -p "$RUN"
          cp "$GITHUB_WORKSPACE"/build/*.png "$RUN"/
          echo "$SHA" > "$RUN/COMMIT"
          git add "$RUN"
          git commit -q -m "Screenshots of run $RUN ($SHA)"
          for _ in 1 2 3; do if git push -q -f "$url" ci-shots; then break; fi; sleep 5; done

      # The score's themes and every cue, rendered by the tests, to be listened to.
      - name: Keep the sounds
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: sounds
          path: build/sounds/*.wav
          retention-days: 14
          if-no-files-found: warn

      - name: Print small screenshots
        if: always()
        run: |
          # The launcher's screens, larger, are printed by the job after this
          # one, in a log of their own that is never trimmed.
          for shot in build/launcher.png build/launcher-menu.png build/launcher-news.png build/launcher-settings.png build/launcher-play.png build/launcher-off.png build/launcher-downloading.png; do
            if [ -s "$shot" ]; then
              sips -s format jpeg -s formatOptions 65 -Z 900 "$shot" --out "${shot%.png}-print.jpg" >/dev/null
            fi
          done
          # The realm's front door, small enough that the end of the next
          # job's log, where it is printed last, can be read in one piece.
          if [ -s build/launcher-play.png ]; then
            sips -s format jpeg -s formatOptions 30 -Z 480 build/launcher-play.png --out build/door-small.jpg >/dev/null
          fi
          # The game's screens, small, each printed last in a log of its own
          # by the job after this one, so the tail of that log holds it whole.
          # Small enough, its colour profile dropped, that the tail of that
          # log holds the whole of it.
          for shot in build/game-plain.png build/game-world.png build/game-later.png build/game-network.png build/game-lakes.png; do
            if [ -s "$shot" ]; then
              # The world's own views large enough to judge its light and
              # water by; the others small.
              case "$shot" in
                build/game-world.png|build/game-later.png|build/game-lakes.png) size=1200; quality=60 ;;
                *) size=400; quality=28 ;;
              esac
              sips -s format jpeg -s formatOptions "$quality" -Z "$size" --deleteColorManagementProperties "$shot" --out "${shot%.png}-review.jpg" >/dev/null
            fi
          done
          for shot in build/game-world.png build/game-plain.png build/game-network.png build/game-away.png build/game-briefing.png build/game-lakes.png build/game-omen.png build/game-first-steps.png build/game-later.png build/game-race.png build/game-ending.png build/game-lakes-no-land.png build/game-lakes-no-furniture.png build/game-lakes-no-models.png build/game-lakes-no-water.png build/game-lakes-no-motes.png; do
            if [ -s "$shot" ]; then
              small="${shot%.png}-small.jpg"
              sips -s format jpeg -s formatOptions 45 -Z 560 "$shot" --out "$small" >/dev/null
              echo "::group::Screenshot $shot, base64 JPEG"
              base64 -i "$small" | fold -w 120
              echo "::endgroup::"
            fi
          done
          # One larger look at the world, for judging its detail.
          if [ -s build/game-world.png ]; then
            sips -s format jpeg -s formatOptions 50 -Z 1100 build/game-world.png --out build/game-world-large.jpg >/dev/null
            echo "::group::Screenshot build/game-world-large.png, base64 JPEG"
            base64 -i build/game-world-large.jpg | fold -w 120
            echo "::endgroup::"
          fi
          # The lake close up, large and less compressed, for judging the
          # black water, the moon and the stars.
          if [ -s build/game-lake-close.png ]; then
            sips -s format jpeg -s formatOptions 80 -Z 1100 build/game-lake-close.png --out build/game-lake-close.jpg >/dev/null
            echo "::group::Screenshot build/game-lake-close.png, base64 JPEG"
            base64 -i build/game-lake-close.jpg | fold -w 120
            echo "::endgroup::"
          fi
          # The icon as actool compiled it, last and small, so it survives a
          # trimmed log.
          if [ -s build/icon.png ]; then
            sips -s format jpeg -s formatOptions 80 -Z 256 build/icon.png --out build/icon-small.jpg >/dev/null
            echo "::group::Screenshot build/icon.png, base64 JPEG"
            base64 -i build/icon-small.jpg | fold -w 120
            echo "::endgroup::"
          fi

      - name: Keep the launcher's screens for printing
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: launcher-screens
          path: |
            build/*-print.jpg
            build/door-small.jpg
          if-no-files-found: warn

      - name: Keep the game's screens for printing
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: game-screens
          path: build/*-review.jpg
          if-no-files-found: warn

      # The world's frames, small: a line each, before the summary so the
      # summary stays at the log's foot.
      - name: Thumbnails
        if: always()
        run: |
          for thumb in build/*.thumb.b64; do
            [ -f "$thumb" ] && echo "RENDER64 $(basename "$thumb" .thumb.b64) $(cat "$thumb")"
          done
          true

      # Last, so it survives a trimmed log: frame times, test failures and
      # warnings, in a few lines.
      - name: Summary
        if: always()
        run: |
          echo "::group::Summary"
          grep -h "PERF \|SOUND \|LAYOUT \|LAKECLOSE \|MOONPATH \|STARS \|STILL \|MIST \|LAKEAFAR \|PERF-CHECK " build-test.log 2>/dev/null || true
          cat build/perf-check.log 2>/dev/null || true
          # Whose voices were heard, and their verdict.
          sed -n '1p;/^Every line within the rules\.$/p;/^Out of bounds:$/,$p' build/voices-report.txt 2>/dev/null | head -n 20 || true
          # Whose counsel was taken, and its verdict.
          sed -n '1p;$p' build/counsel-report.txt 2>/dev/null || true
          # The keeper's phone beside their Mac: what it did, and what the Mac saw.
          cat build/companion-report.txt 2>/dev/null || true
          grep -h "^On \|^The Mac sees\|^Counsel on the phone: \|^Nullmere Companion, on\|^Bundled" build/smoke-companion.log build/companion-build.log 2>/dev/null || true
          # Counsel taken on the phone, through its own model: whose, and its verdict.
          sed -n '1p;$p' build/counsel-phone-report.txt 2>/dev/null || true
          # The ballad the runner's own model made, as a keeper's Mac makes one.
          grep -h "^ballad of " build/voices-report.txt 2>/dev/null || true
          grep -h "REHEARSAL\|error:" build/rehearsal.log 2>/dev/null || true
          grep -hE "error|warning" build/smoke-*.log 2>/dev/null | head -20 || true
          tail -n 15 build/game-stdout.log 2>/dev/null || true
          tail -n 15 build/steward.log 2>/dev/null || true
          # Each warning once; which tests skipped, and why, so a skip can't hide a test.
          grep -h ": warning:" build.log build-test.log 2>/dev/null | sort -u | head -20 || true
          grep -h "Test skipped" build-test.log 2>/dev/null | sed 's|^.*/Tests/||' | sort -u | head -20 || true
          cat build/coverage.log 2>/dev/null || true
          grep -h "Executed .* tests" build-test.log 2>/dev/null | tail -1 || true
          # The world's share of the screen, measured: that its test ran.
          grep -h "ChromeBudgetTests" build-test.log 2>/dev/null | tail -2 || true
          grep -h "^LAYOUT" build-test.log 2>/dev/null | cut -c1-600 || true
          # Each pass of a frame's staging timed, its slowest frames named,
          # near the foot for when a staging figure is over its allowance.
          grep -h "PERF staging" build-test.log 2>/dev/null | tail -3 || true
          # Failures last, at the log's very foot, where its tail finds them.
          grep -hE "error: |failed \(" build.log build-test.log 2>/dev/null | grep -v "^ *|" | awk '!seen[$0]++' | head -40 || true
          # A figure over its allowance among them, with the runner's pace it
          # was allowed, and those recorded without a baseline yet.
          grep -hE "CPU figures allowed|paced by|REGRESSED|MISSING|TOO FAST|RECORDED|PERF-CHECK failed" build/perf-check.log 2>/dev/null || true
          echo "::endgroup::"

  # The app as VoiceOver and Accessibility Inspector meet it, through the
  # Mac's own accessibility: Xcode's UI testing opens the debug build as a
  # keeper would, puts every screen to its accessibility audit, and walks
  # the lake's map through the elements VoiceOver reads.
  accessibility:
    name: Accessibility audit
    runs-on: macos-26
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - name: Show toolchain
        run: xcodebuild -version

      # UI tests drive the Mac: let them, without a password prompt.
      - name: Let UI tests drive the Mac
        run: sudo automationmodetool enable-automationmode-without-authentication || echo "::warning::Could not enable automation mode"

      # The debug app built and registered, then the UI tests: one command,
      # as on a contributor's Mac.
      - name: Audit every screen and walk the map
        run: scripts/ui-test.sh

      # Last, so a short read of the log holds it: what the audit and the
      # walk found, and how the tests ended.
      - name: Summary
        if: always()
        run: |
          echo "::group::Summary"
          # Each finding once, however many times it was said.
          grep -hoE "(UIAUDIT|UIWALK).*" build/ui-test.log 2>/dev/null | cut -c1-420 | sort -u | head -n 140 || true
          grep -hE "UIMAP" build/ui-test.log 2>/dev/null | cut -c1-1500 | head -n 2 || true
          grep -hoE "UISCREEN.*" build/ui-test.log 2>/dev/null | head -n 1 || true
          grep -hE "error: -\[|failed - " build/ui-test.log 2>/dev/null | cut -c1-300 | head -n 20 || true
          grep -hE "Test Case .* (passed|failed)|\*\* TEST" build/ui-test.log 2>/dev/null || true
          # The app crashing under the tests, if it did: why, and where.
          python3 scripts/crash-summary.py --only Nullmere ~/Library/Logs/DiagnosticReports || true
          echo "::endgroup::"

      # Each text on screen as measured from the pixels, the audit's verdict
      # beside it: last, so the end of the log holds it.
      - name: Texts measured
        if: always()
        run: grep -hoE "UITEXT.*" build/ui-test.log 2>/dev/null | cut -c1-150 | sort -u | head -n 110 || true

  # The launcher's screens, printed where the long macOS log can't trim
  # them, for readers without access to the artifacts.
  screens:
    name: Launcher screens
    needs: macos
    # Only once the Mac job ran: when no macOS runner took it (GitHub's
    # arm64 capacity, runs 551 and 553) there are no screens to print.
    if: ${{ always() && (needs.macos.result == 'success' || needs.macos.result == 'failure') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: launcher-screens
          path: screens
        continue-on-error: true
      - name: Print the launcher's screens
        run: |
          for shot in screens/*-print.jpg; do
            [ -s "$shot" ] || continue
            name="$(basename "$shot" -print.jpg)"
            echo "::group::Screenshot build/$name.png, base64 JPEG"
            base64 -w 120 "$shot"
            echo "::endgroup::"
          done
          # The realm's front door once more, small and last of all, so the
          # end of the log holds it whole.
          if [ -s screens/door-small.jpg ]; then
            echo "::group::Screenshot build/launcher-play.png, small, base64 JPEG"
            base64 -w 120 screens/door-small.jpg
            echo "::endgroup::"
          fi

  # The game's screens, one to a log and last in it, small enough that the
  # log's tail holds the whole of it: for judging how much of the world the
  # interface leaves in view, by readers without access to the artifacts.
  game-screens:
    name: Game screen ${{ matrix.screen }}
    needs: macos
    # Only once the Mac job ran: when no macOS runner took it (GitHub's
    # arm64 capacity, runs 551 and 553) there are no screens to print.
    if: ${{ always() && (needs.macos.result == 'success' || needs.macos.result == 'failure') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        screen: [game-plain, game-world, game-later, game-network, game-lakes]
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: game-screens
          path: screens
        continue-on-error: true
      - name: Print the screen
        run: |
          shot="screens/${{ matrix.screen }}-review.jpg"
          if [ -s "$shot" ]; then
            echo "::group::Screenshot build/${{ matrix.screen }}.png, small, base64 JPEG"
            base64 -w 120 "$shot"
            echo "::endgroup::"
          else
            echo "No ${{ matrix.screen }} screen this run."
          fi

  # The rules and the realm on Linux, where the steward runs; then the realm
  # module published to a real SpacetimeDB server, the steward taking it up,
  # and two keepers playing through it.
  realm:
    name: Realm on SpacetimeDB
    runs-on: ubuntu-24.04
    container: swift:6.2-noble
    timeout-minutes: 60
    # "bash" runs with -o pipefail: a test that fails fails the step, though
    # its output goes through tee.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - name: Build the rules, the realm and the steward
        run: swift build -Xswiftc -warnings-as-errors 2>&1 | tee realm-build.log

      # The map's preview data, from the rules and the map's own packing
      # code: kept building, so the map can always be tuned in a browser.
      # A long age on every shape of lake, its world checked throughout.
      - name: Test the rules and the realm
        env:
          NULLMERE_SOAK_WATCHES: "200"
        run: swift test --enable-code-coverage 2>&1 | tee realm-test.log

      - name: Coverage
        run: |
          apt-get update -qq && apt-get install -y -qq python3 >/dev/null
          python3 scripts/coverage.py "$(swift test --show-codecov-path)" NullmereCore=97 NullmereModels=97 NullmereWorld=97 NullmereSound=97 NullmereRealm=97 LauncherCore=97

      - name: Install Rust and SpacetimeDB
        run: |
          apt-get update -qq && apt-get install -y -qq curl build-essential >/dev/null
          curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --target wasm32-unknown-unknown
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          curl -sSf https://install.spacetimedb.com | sh -s -- --yes
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # The Docker client, for the runner's own Docker, whose socket every
      # job container is given: the steward's image is built as the realm
      # proper's is, so its Dockerfile can't fall out of step with the code.
      - name: Install the Docker client
        run: |
          curl -fsSL https://download.docker.com/linux/static/stable/x86_64/docker-27.5.1.tgz \
            | tar -xz -C /usr/local/bin --strip-components=1 docker/docker
          docker version

      # The one command that raises the realm proper, rehearsed: it checks
      # its tools, builds the module and the steward's image from
      # Dockerfile.steward, and says what it would do, publishing nothing.
      # With ael's sign-in it does it. The steward in its image then starts,
      # and asks which realm to steward.
      - name: Rehearse raising the realm proper
        run: |
          STEWARD=docker NULLMERE_STATE_DIR="$PWD/realm-state" scripts/raise-realm.sh maincloud --dry-run
          docker run --rm nullmere-steward > realm-steward-image.log 2>&1 || true
          cat realm-steward-image.log
          grep -q "usage: NullmereSteward" realm-steward-image.log

      # The same one command that raises the realm proper, without the
      # steward: the integration tests run their own.
      - name: Start SpacetimeDB and publish the realm module
        run: |
          STEWARD=none NULLMERE_STATE_DIR="$PWD/realm-state" scripts/raise-realm.sh local
          token="$(cat realm-state/steward-token-local)"
          echo "::add-mask::$token"
          echo "NULLMERE_STDB_TOKEN=$token" >> "$GITHUB_ENV"
          # Two realms and the Frontier between them, each a database of its
          # own; and three more, fresh, for keepers' clients to play it through.
          # And one for a full realm of keepers' clients at once; two for a
          # realm whose world goes ahead of its publications; and one for a
          # keeper's phone beside their Mac.
          for db in frontier-west frontier-east frontier play-west play-east play-frontier crowd ahead ahead-rules companion; do
            REALM_DB="$db" STEWARD=none NULLMERE_STATE_DIR="$PWD/realm-state" scripts/raise-realm.sh local
          done

      # The macOS job skips these, with no server to play through; here they
      # must run, every one: a skip would pass for a play-through.
      - name: Play through SpacetimeDB
        # A play-through takes two or three minutes. One that stops
        # answering fails here in its own time, its output written line by
        # line so the log shows the test it stopped in, not at the job's limit.
        timeout-minutes: 15
        env:
          NULLMERE_STDB: http://127.0.0.1:3000/nullmere
          NULLMERE_STDB_FRONTIER: http://127.0.0.1:3000/frontier-west,http://127.0.0.1:3000/frontier-east,http://127.0.0.1:3000/frontier
          NULLMERE_STDB_FRONTIER_PLAY: http://127.0.0.1:3000/play-west,http://127.0.0.1:3000/play-east,http://127.0.0.1:3000/play-frontier
          NULLMERE_STDB_CROWD: http://127.0.0.1:3000/crowd
          NULLMERE_STDB_AHEAD: http://127.0.0.1:3000/ahead
          NULLMERE_STDB_AHEAD_RULES: http://127.0.0.1:3000/ahead-rules
          NULLMERE_STDB_COMPANION: http://127.0.0.1:3000/companion
        run: |
          stdbuf -oL -eL swift test --skip-build --filter SpacetimeIntegrationTests 2>&1 | tee realm-integration.log
          total="$(grep "Executed .* tests" realm-integration.log | tail -n 1)"
          echo "$total" | grep -Eq "Executed [1-9][0-9]* tests?, with 0 failures" || {
            echo "::error::The play-through through SpacetimeDB didn't run whole: $total"
            exit 1
          }

      # A whole realm standing alone, raised by the one command: the module
      # published, the steward started in the background, and the realm's
      # status read back as a keeper would, and as the go-live check reads
      # it; then the steward stopped.
      - name: Raise a standalone realm in one command
        run: |
          export REALM_DB=standalone NULLMERE_STATE_DIR="$PWD/realm-state" STEWARD_LOG="$PWD/realm-state/standalone.log"
          CONFIGURATION=debug STEWARD=background scripts/raise-realm.sh local
          REALM_ADDRESS=http://127.0.0.1:3000/standalone scripts/go-live-status.sh --expect-realm
          # Two keepers' clients meet in it as they would in the live realm,
          # by the same test the Live realm smoke workflow runs on maincloud.
          NULLMERE_LIVE_REALM=http://127.0.0.1:3000/standalone swift test --skip-build --filter LiveRealmSmokeTests 2>&1 | tee realm-live-smoke.log
          grep -Eq "Executed 1 test, with 0 failures" realm-live-smoke.log && ! grep -q "skipped" realm-live-smoke.log || {
            echo "::error::Two keepers didn't meet in the standalone realm"
            exit 1
          }
          scripts/raise-realm.sh local --stop

      - name: Summary
        if: always()
        run: |
          grep -hE "error: |warning: " realm-build.log 2>/dev/null | head -20 || true
          # Failures first, so the skipped tests' lines never crowd them out.
          grep -hE "error: |failed \(" realm-test.log realm-integration.log 2>/dev/null | awk '!seen[$0]++' | head -20 || true
          grep -hE "error|failed|skipped|Executed|REALM " realm-test.log realm-integration.log 2>/dev/null | tail -20 || true
          # Where the play-through was when it ended, whole or not.
          grep -hE "Test Case .*(started|passed|failed)" realm-integration.log 2>/dev/null | tail -6 || true
          # The Frontier play-through's last steps, and its watchdog's word if it stalled.
          grep -h "^PLAY " realm-integration.log 2>/dev/null | tail -8 || true
          # The full realm's figures, or where its crowd stood when it stopped.
          grep -h "^CROWD " realm-integration.log 2>/dev/null | tail -6 || true
          tail -n 30 realm-state/spacetime-local.log 2>/dev/null || true
          tail -n 10 realm-state/standalone.log 2>/dev/null || true
