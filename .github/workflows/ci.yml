name: CI

# One macOS job per pull request update, and per push to main or a working
# branch. Changes that only touch documentation or the browser preview don't
# start a run.
on:
  pull_request:
    paths:
      - Package.swift
      - Sources/**
      - Tests/**
      - Packaging/**
      - scripts/**
      - perf/**
      - realm-server/**
      - Dockerfile.steward
      - .github/workflows/ci.yml
  push:
    branches: [main, "claude/**"]
    paths:
      - Package.swift
      - Sources/**
      - Tests/**
      - Packaging/**
      - scripts/**
      - perf/**
      - realm-server/**
      - Dockerfile.steward
      - .github/workflows/ci.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: Build, test and bundle
    # macOS 26 and Xcode 26: the launcher needs the Foundation Models
    # framework, and its tests only run on the OS they target.
    runs-on: macos-26
    timeout-minutes: 30
    # "bash" runs with -o pipefail, so a failure piped through tee still fails.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Check the scripts
        run: scripts/check-scripts.sh

      - name: Build
        id: build
        run: |
          swift build 2>&1 | tee build.log
          # A clean build: no warnings from our own sources.
          if grep -E "^/.*/Sources/.*: warning:" build.log; then
            echo "::error::The build has warnings"
            exit 1
          fi

      - name: Test
        run: NULLMERE_KEEP_RENDERS="$PWD/build" swift test --enable-code-coverage 2>&1 | tee build-test.log

      # How much of each module the tests run, held to a floor.
      - name: Coverage
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: mkdir -p build && python3 scripts/coverage.py "$(swift test --show-codecov-path)" NullmereCore=96 NullmereRealm=93 NullmereKit=92 LauncherCore=97 LauncherKit=93 --worst 30 --lines 12 | tee build/coverage.log

      # How long each scene takes the GPU at a MacBook Pro's native
      # resolution, a whole frame while the camera pans, an order and a
      # watch: held to perf/baseline.json, so a regression fails the build.
      - name: Frame times
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          grep "PERF " build-test.log || true
          mkdir -p build
          python3 scripts/perf-check.py build-test.log perf/baseline.json --json build/perf.json | tee build/perf-check.log

      # Xcode 26 and later ship the Metal compiler separately. Fetch it only
      # when no installed Xcode has one; check-shader.sh also tries them all.
      # A slow or failed download only skips the offline compile (with a
      # warning); `swift test` still compiles the shader on the runner's GPU.
      - name: Ensure a Metal compiler
        timeout-minutes: 10
        continue-on-error: true
        run: |
          if xcrun -sdk macosx metal --version >/dev/null 2>&1; then
            echo "Metal compiler available in the selected Xcode"
            exit 0
          fi
          for app in /Applications/Xcode*.app; do
            if DEVELOPER_DIR="$app/Contents/Developer" xcrun -sdk macosx metal --version >/dev/null 2>&1; then
              echo "Metal compiler available in $app"
              exit 0
            fi
          done
          xcodebuild -downloadComponent MetalToolchain || echo "::warning::Could not download the Metal toolchain"

      - name: Compile shader offline
        run: scripts/check-shader.sh

      - name: Bundle app
        run: scripts/build-app.sh

      - name: Verify bundles
        run: |
          verify() {
            app="build/$1.app"
            codesign --verify --deep --strict --verbose=2 "$app"
            test -x "$app/Contents/MacOS/$2"
            test "$(lipo -archs "$app/Contents/MacOS/$2")" = "arm64"
            test "$(plutil -extract LSMinimumSystemVersion raw "$app/Contents/Info.plist")" = "26.0"
            test "$(plutil -extract CFBundleIdentifier raw "$app/Contents/Info.plist")" = "$3"
            test -s "$app/Contents/Resources/AppIcon.icns"
          }
          verify "Nullmere Online" NullmereLauncher online.nullmere.launcher
          test "$(plutil -extract NullmereRealm raw "build/Nullmere Online.app/Contents/Info.plist")" = "https://maincloud.spacetimedb.com/nullmere"
          test ! -e build/Nullmere.app
          # The Liquid Glass icon compiled into the app.
          for app in "build/Nullmere Online.app"; do
            test -s "$app/Contents/Resources/Assets.car"
            test "$(plutil -extract CFBundleIconName raw "$app/Contents/Info.plist")" = "AppIcon"
          done
          # A look at the icon as compiled, for readers of the log.
          sips -s format png "build/Nullmere Online.app/Contents/Resources/AppIcon.icns" --out build/icon.png >/dev/null

      # The disk image players download, made the way a release is made;
      # mounted again to see the app inside is whole.
      - name: Pack the disk image
        run: |
          scripts/release.sh
          dmg="$(ls build/Nullmere-Online-*.dmg)"
          mount="$(mktemp -d)"
          hdiutil attach -quiet -readonly -nobrowse -mountpoint "$mount" "$dmg"
          codesign --verify --deep --strict "$mount/Nullmere Online.app"
          test -L "$mount/Applications"
          hdiutil detach -quiet "$mount"
          ls -lh "$dmg"

      - name: Keep the disk image
        uses: actions/upload-artifact@v5
        with:
          name: nullmere-online-dmg
          path: build/Nullmere-Online-*.dmg
          if-no-files-found: error

      # The signed, notarized release rehearsed with a throwaway identity:
      # the same steps release.yml takes with the Developer ID, so a real
      # release wants only the secrets.
      - name: Rehearse a signed release
        timeout-minutes: 10
        run: scripts/rehearse-release.sh 2>&1 | tee build/rehearsal.log

      # Opens the real app on the runner: it must keep running and render its
      # lake with Metal. The runner can't use Apple Intelligence, so the
      # launcher opens on its requirement screen. The screenshot (Dock
      # included) is kept as an artifact, and a small copy is printed in the
      # log for readers without artifact access.
      - name: Launch the app
        run: mkdir -p build && scripts/smoke-test-app.sh 2>&1 | tee build/smoke-app.log

      # Opens the debug build of the launcher as if the model were ready
      # (only debug builds allow that), to photograph its menu, News and
      # Settings, which the requirement screen otherwise hides on CI.
      - name: Open the launcher's menu
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: mkdir -p build && scripts/smoke-test-launcher-menu.sh 2>&1 | tee build/smoke-menu.log

      # Opens the debug build of the game past the model gate (only debug
      # builds allow that): its title screen, then a new game, whose world
      # must render with Metal.
      - name: Open the game
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: mkdir -p build && scripts/smoke-test-game.sh 2>&1 | tee build/smoke-game.log

      # A realm raised on the runner, as on maincloud: SpacetimeDB with the
      # realm module published, and the steward beside it. Then the app
      # itself enters the world across the network.
      - name: Raise a realm on SpacetimeDB
        id: realm
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 20
        run: |
          command -v rustup >/dev/null || curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.cargo/bin:$HOME/.local/bin:$PATH"
          curl -sSf https://install.spacetimedb.com | sh -s -- --yes
          # The same one command that raises the realm proper.
          STEWARD=background CONFIGURATION=debug STEWARD_LOG="$PWD/build/steward.log" \
            NULLMERE_REALM_SEED="black moon" scripts/raise-realm.sh local

      - name: Enter the realm across the network
        if: ${{ !cancelled() && steps.realm.outcome == 'success' }}
        env:
          NULLMERE_REALM: http://127.0.0.1:3000/nullmere
        run: mkdir -p build && scripts/smoke-test-network.sh 2>&1 | tee build/smoke-network.log

      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: screenshots
          path: build/*.png
          if-no-files-found: warn

      - name: Print small screenshots
        if: always()
        run: |
          # The launcher's screens, larger, are printed by the job after this
          # one, in a log of their own that is never trimmed.
          for shot in build/launcher.png build/launcher-menu.png build/launcher-news.png build/launcher-settings.png build/launcher-play.png build/launcher-off.png build/launcher-downloading.png; do
            if [ -s "$shot" ]; then
              sips -s format jpeg -s formatOptions 65 -Z 900 "$shot" --out "${shot%.png}-print.jpg" >/dev/null
            fi
          done
          for shot in build/game-world.png build/game-network.png build/game-away.png build/game-briefing.png build/game-lakes.png build/game-omen.png build/game-first-steps.png build/game-later.png build/game-race.png build/game-ending.png; do
            if [ -s "$shot" ]; then
              small="${shot%.png}-small.jpg"
              sips -s format jpeg -s formatOptions 45 -Z 560 "$shot" --out "$small" >/dev/null
              echo "::group::Screenshot $shot, base64 JPEG"
              base64 -i "$small" | fold -w 120
              echo "::endgroup::"
            fi
          done
          # One larger look at the world, for judging its detail.
          if [ -s build/game-world.png ]; then
            sips -s format jpeg -s formatOptions 50 -Z 1100 build/game-world.png --out build/game-world-large.jpg >/dev/null
            echo "::group::Screenshot build/game-world-large.png, base64 JPEG"
            base64 -i build/game-world-large.jpg | fold -w 120
            echo "::endgroup::"
          fi
          # The lake close up, large and less compressed, for judging the
          # black water, the moon and the stars.
          if [ -s build/game-lake-close.png ]; then
            sips -s format jpeg -s formatOptions 80 -Z 1100 build/game-lake-close.png --out build/game-lake-close.jpg >/dev/null
            echo "::group::Screenshot build/game-lake-close.png, base64 JPEG"
            base64 -i build/game-lake-close.jpg | fold -w 120
            echo "::endgroup::"
          fi
          # The icon as actool compiled it, last and small, so it survives a
          # trimmed log.
          if [ -s build/icon.png ]; then
            sips -s format jpeg -s formatOptions 80 -Z 256 build/icon.png --out build/icon-small.jpg >/dev/null
            echo "::group::Screenshot build/icon.png, base64 JPEG"
            base64 -i build/icon-small.jpg | fold -w 120
            echo "::endgroup::"
          fi

      - name: Keep the launcher's screens for printing
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: launcher-screens
          path: build/*-print.jpg
          if-no-files-found: warn

      # Last, so it survives a trimmed log: frame times, test failures and
      # warnings, in a few lines.
      - name: Summary
        if: always()
        run: |
          echo "::group::Summary"
          grep -h "PERF \|SOUND \|LAYOUT \|LAKECLOSE \|MOONPATH \|STARS \|STILL \|MIST \|PERF-CHECK " build-test.log 2>/dev/null || true
          grep -hE "error: |failed \(|: warning:" build.log build-test.log 2>/dev/null | head -40 || true
          grep -h "Executed .* tests" build-test.log 2>/dev/null | tail -1 || true
          cat build/coverage.log 2>/dev/null || true
          cat build/perf-check.log 2>/dev/null || true
          grep -h "REHEARSAL\|error:" build/rehearsal.log 2>/dev/null || true
          grep -hE "error|warning" build/smoke-*.log 2>/dev/null | head -20 || true
          tail -n 15 build/game-stdout.log 2>/dev/null || true
          tail -n 15 build/steward.log 2>/dev/null || true
          echo "::endgroup::"

  # The launcher's screens, printed where the long macOS log can't trim
  # them, for readers without access to the artifacts.
  screens:
    name: Launcher screens
    needs: macos
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: launcher-screens
          path: screens
        continue-on-error: true
      - name: Print the launcher's screens
        run: |
          for shot in screens/*-print.jpg; do
            [ -s "$shot" ] || continue
            name="$(basename "$shot" -print.jpg)"
            echo "::group::Screenshot build/$name.png, base64 JPEG"
            base64 -w 120 "$shot"
            echo "::endgroup::"
          done

  # The rules and the realm on Linux, where the steward runs; then the realm
  # module published to a real SpacetimeDB server, the steward taking it up,
  # and two keepers playing through it.
  realm:
    name: Realm on SpacetimeDB
    runs-on: ubuntu-24.04
    container: swift:6.2-noble
    timeout-minutes: 45
    # "bash" runs with -o pipefail: a test that fails fails the step, though
    # its output goes through tee.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - name: Build the rules, the realm and the steward
        run: swift build -Xswiftc -warnings-as-errors 2>&1 | tee realm-build.log

      # The map's preview data, from the rules and the map's own packing
      # code: kept building, so the map can always be tuned in a browser.
      - name: Write the map preview's tiles
        run: scripts/world-preview-data.sh

      # A long age on every shape of lake, its world checked throughout.
      - name: Test the rules and the realm
        env:
          NULLMERE_SOAK_WATCHES: "200"
        run: swift test --enable-code-coverage 2>&1 | tee realm-test.log

      - name: Coverage
        run: |
          apt-get update -qq && apt-get install -y -qq python3 >/dev/null
          python3 scripts/coverage.py "$(swift test --show-codecov-path)" NullmereCore=93 NullmereRealm=91

      - name: Install Rust and SpacetimeDB
        run: |
          apt-get update -qq && apt-get install -y -qq curl build-essential >/dev/null
          curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --target wasm32-unknown-unknown
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          curl -sSf https://install.spacetimedb.com | sh -s -- --yes
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # The one command that raises the realm proper, rehearsed: it checks
      # its tools, builds the module and the steward, and says what it
      # would do, publishing nothing. With ael's sign-in it does it.
      - name: Rehearse raising the realm proper
        run: CONFIGURATION=debug STEWARD=background NULLMERE_STATE_DIR="$PWD/realm-state" scripts/raise-realm.sh maincloud --dry-run

      # The same one command that raises the realm proper, without the
      # steward: the integration tests run their own.
      - name: Start SpacetimeDB and publish the realm module
        run: |
          STEWARD=none NULLMERE_STATE_DIR="$PWD/realm-state" scripts/raise-realm.sh local
          token="$(cat realm-state/steward-token-local)"
          echo "::add-mask::$token"
          echo "NULLMERE_STDB_TOKEN=$token" >> "$GITHUB_ENV"

      - name: Play through SpacetimeDB
        env:
          NULLMERE_STDB: http://127.0.0.1:3000/nullmere
        run: swift test --skip-build --filter SpacetimeIntegrationTests 2>&1 | tee realm-integration.log

      # A whole realm standing alone, raised by the one command: the module
      # published, the steward started in the background, and the realm's
      # status read back as a keeper would, and as the go-live check reads
      # it; then the steward stopped.
      - name: Raise a standalone realm in one command
        run: |
          export REALM_DB=standalone NULLMERE_STATE_DIR="$PWD/realm-state" STEWARD_LOG="$PWD/realm-state/standalone.log"
          CONFIGURATION=debug STEWARD=background scripts/raise-realm.sh local
          REALM_ADDRESS=http://127.0.0.1:3000/standalone scripts/go-live-status.sh --expect-realm
          scripts/raise-realm.sh local --stop

      - name: Summary
        if: always()
        run: |
          grep -hE "error: |warning: " realm-build.log 2>/dev/null | head -20 || true
          grep -hE "error|failed|skipped|Executed|REALM " realm-test.log realm-integration.log 2>/dev/null | tail -20 || true
          tail -n 30 realm-state/spacetime-local.log 2>/dev/null || true
          tail -n 10 realm-state/standalone.log 2>/dev/null || true
