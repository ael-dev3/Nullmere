name: Release

# A version tag (v1.0.0) tests the tagged commit, builds Nullmere Online's
# disk image, signs and notarizes it with the Developer ID in the
# repository's secrets, checks the image as a player receives it
# (scripts/verify-release.sh), and attaches it, with its SHA-256, to a
# GitHub release. Without those secrets it releases an ad-hoc signed image,
# marked as such.
#
# CI rehearses this whole path on every push with a throwaway identity
# (scripts/rehearse-release.sh), so adding the secrets is all that's left.
#
# Secrets, once (Settings > Secrets and variables > Actions):
#   MACOS_CERTIFICATE           the Developer ID Application certificate, a base64 .p12
#   MACOS_CERTIFICATE_PASSWORD  its password
#   APPLE_API_KEY               an App Store Connect API key, the base64 .p8
#   APPLE_API_KEY_ID            its key id
#   APPLE_API_ISSUER            its issuer id
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

# One release at a time, and never one cut short.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Sign, notarize and release
    runs-on: macos-26
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # The version comes from the tag, so the tag must be one: v1.2.3, or
      # v1.2.3-beta.1 for a prerelease.
      - name: Read the version
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            echo "$GITHUB_REF_NAME" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$' || {
              echo "::error::$GITHUB_REF_NAME is not a version tag such as v1.0.0"
              exit 1
            }
            version="${GITHUB_REF_NAME#v}"
          else
            version="0.0.0-$(git rev-parse --short HEAD)"
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      # Whatever commit the tag names, nothing ships that fails its tests.
      - name: Test before releasing
        run: swift test 2>&1 | tee "$RUNNER_TEMP/test.log" | grep -E "error:|failed \(|Executed .* tests" || true

      # The last count is the whole run's; each suite that passed has its own.
      - name: Tests passed
        run: |
          grep "Executed .* tests" "$RUNNER_TEMP/test.log" | tail -n 1 | grep -Eq "(with|and) 0 failures" || {
            grep -E "error:|failed \(" "$RUNNER_TEMP/test.log" | head -40
            echo "::error::The tagged commit fails its tests: nothing is released"
            exit 1
          }

      - name: Take up the Developer ID
        id: identity
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          if [ -z "$MACOS_CERTIFICATE" ] || [ -z "$APPLE_API_KEY" ]; then
            echo "::warning::No Developer ID in the secrets: this release is ad-hoc signed and not notarized"
            exit 0
          fi
          scripts/take-up-identity.sh

      - name: Pack the disk image
        env:
          CODESIGN_IDENTITY: ${{ steps.identity.outputs.identity }}
          NOTARY_KEYCHAIN: ${{ steps.identity.outputs.keychain }}
          NOTARY_PROFILE: ${{ steps.identity.outputs.notary }}
        # Without the secrets these are empty, and the image is ad-hoc signed.
        run: |
          scripts/release.sh
          echo "DMG=build/Nullmere-Online-$VERSION.dmg" >> "$GITHUB_ENV"

      # As a player receives it: whole, named Nullmere Online, at this
      # version, signed by the Developer ID and notarized when they are in
      # the secrets. Writes the image's SHA-256 beside it.
      - name: Check the disk image
        env:
          AUTHORITY: ${{ steps.identity.outputs.identity }}
          NOTARIZED: ${{ steps.identity.outputs.notary != '' && '1' || '' }}
        run: scripts/verify-release.sh "$DMG" "$VERSION"

      - name: Keep the disk image
        uses: actions/upload-artifact@v5
        with:
          name: nullmere-online-release
          path: |
            build/Nullmere-Online-*.dmg
            build/Nullmere-Online-*.dmg.sha256
          if-no-files-found: error

      - name: Release it
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNED: ${{ steps.identity.outputs.identity }}
        run: |
          scripts/release-notes.sh "$GITHUB_REF_NAME" ${SIGNED:+signed} > "$RUNNER_TEMP/notes.md"
          # shellcheck disable=SC2016 # the backquotes are the notes' own
          printf '\n**SHA-256** `%s`\n' "$(cut -d' ' -f1 "$DMG.sha256")" >> "$RUNNER_TEMP/notes.md"
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" "$DMG" "$DMG.sha256" $prerelease --verify-tag \
            --title "Nullmere Online ${GITHUB_REF_NAME}" --notes-file "$RUNNER_TEMP/notes.md"

      # The signing keychain goes with the job, whatever became of it.
      - name: Put the identity away
        if: always() && steps.identity.outputs.keychain != ''
        env:
          KEYCHAIN: ${{ steps.identity.outputs.keychain }}
        run: security delete-keychain "$KEYCHAIN" || true
