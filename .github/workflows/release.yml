name: Release

# A version tag (v1.0.0) builds Nullmere Online's disk image, signs and
# notarizes it with the Developer ID in the repository's secrets, and
# attaches it to a GitHub release. Without those secrets it releases an
# ad-hoc signed image, marked as such.
#
# Secrets, once:
#   MACOS_CERTIFICATE           the Developer ID Application certificate, a base64 .p12
#   MACOS_CERTIFICATE_PASSWORD  its password
#   APPLE_API_KEY               an App Store Connect API key, the base64 .p8
#   APPLE_API_KEY_ID            its key id
#   APPLE_API_ISSUER            its issuer id
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Sign, notarize and release
    runs-on: macos-26
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - name: Take up the Developer ID
        id: identity
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          if [ -z "$MACOS_CERTIFICATE" ] || [ -z "$APPLE_API_KEY" ]; then
            echo "::warning::No Developer ID in the secrets: this release is ad-hoc signed and not notarized"
            exit 0
          fi
          keychain="$RUNNER_TEMP/release.keychain-db"
          password="$(uuidgen)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          identity="$(security find-identity -v -p codesigning "$keychain" | sed -n 's/.*"\(Developer ID Application:.*\)"/\1/p' | head -n 1)"
          [ -n "$identity" ] || { echo "::error::No Developer ID Application identity in the certificate"; exit 1; }
          echo "$APPLE_API_KEY" | base64 --decode > "$RUNNER_TEMP/api-key.p8"
          xcrun notarytool store-credentials nullmere --key "$RUNNER_TEMP/api-key.p8" \
            --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER" --keychain "$keychain"
          echo "identity=$identity" >> "$GITHUB_OUTPUT"
          echo "keychain=$keychain" >> "$GITHUB_OUTPUT"

      - name: Pack the disk image
        env:
          CODESIGN_IDENTITY: ${{ steps.identity.outputs.identity }}
          NOTARY_KEYCHAIN: ${{ steps.identity.outputs.keychain }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          [ "$GITHUB_REF_TYPE" = tag ] || version="0.0.0-$(git rev-parse --short HEAD)"
          if [ -n "$CODESIGN_IDENTITY" ]; then
            VERSION="$version" NOTARY_PROFILE=nullmere scripts/release.sh
          else
            VERSION="$version" scripts/release.sh
          fi
          echo "DMG=$(ls build/Nullmere-Online-*.dmg)" >> "$GITHUB_ENV"

      - name: Keep the disk image
        uses: actions/upload-artifact@v5
        with:
          name: nullmere-online-release
          path: build/Nullmere-Online-*.dmg

      - name: Release it
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNED: ${{ steps.identity.outputs.identity }}
        run: |
          notes="Nullmere Online ${GITHUB_REF_NAME}."
          [ -n "$SIGNED" ] || notes="$notes Ad-hoc signed and not notarized: right-click Open the first time."
          gh release create "$GITHUB_REF_NAME" "$DMG" --title "Nullmere Online ${GITHUB_REF_NAME}" --notes "$notes"
